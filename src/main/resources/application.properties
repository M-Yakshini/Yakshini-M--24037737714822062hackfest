spring.application.name=witness-sketch-ai
spring.datasource.url=jdbc:h2:file:./data/witnesssketch;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
witnesssketch.huggingface.token=${HF_TOKEN:}
witnesssketch.huggingface.endpoint=${HF_INFERENCE_ENDPOINT:https://router.huggingface.co/hf-inference/models}
witnesssketch.huggingface.model=${HF_MODEL:stabilityai/stable-diffusion-xl-base-1.0}
